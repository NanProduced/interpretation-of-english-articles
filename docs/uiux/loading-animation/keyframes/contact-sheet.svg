  <text x="48" y="86" fill="#737680" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14">A direction: aperture logo + article skeleton + highlighter annotation. Use frames as visual references, not raster sequence.</text>

