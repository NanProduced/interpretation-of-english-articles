<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <pattern id="paper-grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="0.55" fill="#121212" opacity="0.018"/>
      <circle cx="18" cy="15" r="0.45" fill="#121212" opacity="0.014"/>
    </pattern>
  </defs>
  <rect width="390" height="844" fill="#FAF9F9"/>
  <rect width="390" height="844" fill="url(#paper-grain)"/>

  <g id="ambient-hairlines" opacity="0.55">
    <path d="M78 176H312" stroke="#121212" stroke-opacity="0.025" stroke-width="1"/>
    <path d="M92 646H298" stroke="#121212" stroke-opacity="0.022" stroke-width="1"/>
    <path d="M66 226V512" stroke="#121212" stroke-opacity="0.018" stroke-width="1"/>
  </g>

  <g id="paper-stack">
    <rect x="57" y="142" width="276" height="498" rx="30" fill="#EEEFF3" opacity="0.28"/>
    <rect x="44" y="124" width="302" height="524" rx="32" fill="#FFFFFF" opacity="0.84"/>
    <rect x="44.5" y="124.5" width="301" height="523" rx="31.5" fill="none" stroke="#121212" stroke-opacity="0.035"/>
  </g>

  <g id="logo-aperture" opacity="0.94">
    <circle cx="195" cy="294" r="68" fill="#121212" opacity="0.025"/>
    <image href="../assets/claread-icon-fullcolor.svg" x="148" y="247" width="94" height="94" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="article-lines">
    <rect x="102" y="386" width="186" height="5" rx="2.5" fill="#121212" opacity="0.075"/>
    <rect x="114" y="419" width="162" height="5" rx="2.5" fill="#121212" opacity="0.055"/>
    <rect x="130" y="452" width="130" height="5" rx="2.5" fill="#121212" opacity="0.042"/>
    <rect x="145" y="486" width="100" height="3" rx="1.5" fill="#121212" opacity="0.035"/>
  </g>

  <g id="native-status-text">
    <text x="195" y="566" text-anchor="middle" fill="#737680" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" letter-spacing="2.4">STRUCTURE</text>
    <text x="195" y="600" text-anchor="middle" fill="#121212" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">正在构建文章骨架...</text>
  </g>
