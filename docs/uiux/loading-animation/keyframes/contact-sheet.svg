  <text x="48" y="642" fill="#737680" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13">Layer names inside each SVG: ambient-hairlines, paper-stack, logo-aperture, article-lines, native-status-text.</text>
