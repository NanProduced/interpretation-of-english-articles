<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <pattern id="paper-grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="0.55" fill="#121212" opacity="0.018"/>
      <circle cx="18" cy="15" r="0.45" fill="#121212" opacity="0.014"/>
    </pattern>
  </defs>
  <rect width="390" height="844" fill="#FAF9F9"/>
