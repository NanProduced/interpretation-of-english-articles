    <text x="104" y="422" text-anchor="middle" fill="#121212" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">01 Logo Assemble</text>
  </g>

  <g transform="translate(524 126)">
